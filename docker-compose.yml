services:
  db:
    image: postgres:16
    container_name: nbo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nbo}
      POSTGRES_DB: ${POSTGRES_DB:-nbo}
    ports:
      # Solo al host: en un servidor público no se expone la base a internet.
      # Para abrirla a propósito: DB_BIND=0.0.0.0
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nbo} -d ${POSTGRES_DB:-nbo}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Motor de IA generativa: speech inicial y asistencia por turno.
  # Modo determinista por defecto, sin API key ni LLM externo.
  ai:
    build: ./movistar-ai-main
    container_name: nbo-ai
    environment:
      AI_ENGINE_HOST: 0.0.0.0
      AI_ENGINE_PORT: 8000
      AI_ENGINE_CORS_ORIGINS: ${AI_ENGINE_CORS_ORIGINS:-*}
      AI_ENGINE_GENERATOR: ${AI_ENGINE_GENERATOR:-deterministic}
      # Con una API key y AI_ENGINE_GENERATOR=openai el copiloto redacta con un
      # LLM. Si el proveedor falla o viola guardrails, cae al determinista.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${AI_PORT:-8100}:8000"
    volumes:
      # Conocimiento autorizado derivado de demo.json. Sin esto el motor se
      # abstiene: solo redacta sobre ofertas y tácticas que tiene aprobadas.
      - ./api/app/data/ai/demo_catalog_v01.csv:/srv/fixtures/demo_catalog_v01.csv:ro
      - ./api/app/data/ai/demo_playbook_v01.json:/srv/fixtures/demo_playbook_v01.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build: ./api
    container_name: nbo-api
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nbo:nbo@db:5432/nbo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai:8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Código en vivo; las dependencias siguen siendo las de la imagen.
      - ./api/app:/srv/app
      - ./api/alembic:/srv/alembic
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    container_name: nbo-web
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_PROXY: ${VITE_API_PROXY:-http://api:8000}
      # Host público desde el que se sirve el dashboard (IP o dominio).
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      # Código en vivo; node_modules se queda el de la imagen.
      - ./web:/srv
      - /srv/node_modules
    restart: unless-stopped

volumes:
  db_data:
